name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Shop.slnx

      - name: Build
        run: dotnet build Shop.slnx --no-restore --configuration Release

      - name: Tests (PostgreSQL in Testcontainers)
        run: dotnet test Shop.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          for service in Identity Catalog Inventory Ordering Payment; do
            dotnet ef migrations has-pending-model-changes --project src/Services/$service/Shop.$service --no-build --configuration Release
          done

  web:
    name: Storefront
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 420

      - name: Register, browse, and change the catalog as admin through the gateway
        run: |
          api=http://localhost:8080
          curl -sf $api/health/ready | jq -e '.status == "Healthy"' > /dev/null
          curl -sf "$api/api/catalog/products?category=kahve" | jq -e '.total >= 5' > /dev/null
          curl -sf $api/api/identity/register -H 'Content-Type: application/json' \
            -d '{"email":"ayse@example.com","displayName":"Ayşe","password":"smoke-test-password"}' | jq -e '.user.role == "Customer"' > /dev/null
          admin=$(curl -sf $api/api/identity/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@shop.local","password":"admin-password-change-me"}' | jq -r .accessToken)
          category=$(curl -sf "$api/api/catalog/categories" | jq -r '.[0].id')
          curl -sf $api/api/catalog/products -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d "{\"sku\":\"SMK-001\",\"name\":\"Smoke Test Fincan\",\"price\":99.90,\"categoryId\":\"$category\"}" | jq -e '.slug == "smoke-test-fincan"' > /dev/null
          echo "Registered, browsed and added a product through the gateway."

      - name: Place an order and follow it through the services
        run: |
          api=http://localhost:8080
          token=$(curl -sf $api/api/identity/login -H 'Content-Type: application/json' \
            -d '{"email":"ayse@example.com","password":"smoke-test-password"}' | jq -r .accessToken)
          product=$(curl -sf "$api/api/catalog/products?q=KHV-002" | jq -r '.items[0].id')
          for i in $(seq 1 30); do
            available=$(curl -sf "$api/api/inventory/availability?ids=$product" | jq -r '.[0].available // empty')
            [ -n "$available" ] && break; sleep 1
          done
          card=$(curl -sf $api/api/payment/cards -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"number":"4242 4242 4242 4242","expiryMonth":12,"expiryYear":2030,"cvc":"123"}' | jq -r .token)
          total=$(curl -sf -X PUT "$api/api/basket/items/$product" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"quantity":2}' | jq -r .total)
          order=$(curl -sf $api/api/basket/checkout -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"address\":{\"fullName\":\"Ayşe Yılmaz\",\"line1\":\"Atatürk Cad. No: 24/5\",\"city\":\"Samsun\",\"postalCode\":\"55060\",\"phone\":\"05551234567\"},\"expectedTotal\":$total,\"paymentToken\":\"$card\"}" | jq -r .orderId)
          for i in $(seq 1 30); do
            status=$(curl -s "$api/api/ordering/orders/$order" -H "Authorization: Bearer $token" | jq -r '.status // empty')
            [ "$status" = "Confirmed" ] && break; sleep 1
          done
          echo "Order $order: $status"
          [ "$status" = "Confirmed" ]
          after=$(curl -sf "$api/api/inventory/availability?ids=$product" | jq -r '.[0].available')
          [ "$after" -eq $((available - 2)) ]
          echo "Paid, and the stock held for it: $available → $after available."
          curl -sf "$api/api/ordering/orders/$order" -H "Authorization: Bearer $token" | jq -e '.cardLast4 == "4242"' > /dev/null

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  e2e:
    name: A customer and the admin in browsers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start the stack
        env:
          AUTH_ATTEMPTS_PER_MINUTE: '1000'
        run: docker compose up --build --detach --wait --wait-timeout 420

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the walkthrough
        working-directory: tests/e2e
        run: node shop.mjs

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color gateway ordering inventory payment basket

      - name: Keep the last screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/output/

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
